<!--
  D-LOG new account email.

  PASTE THIS INTO: Supabase dashboard -> Authentication -> Emails -> "Confirm signup" -> Message body.
  It is kept in the repo so the template is reviewable and recoverable, but nothing deploys it —
  `supabase config push` would overwrite every other remote auth setting from a config.toml that has
  never been pushed, so it is not run here (same standing rule as `supabase db push`).

  THE ONE THING THAT MATTERS: this template must contain {{ .Token }} and must NOT be a bare
  {{ .ConfirmationURL }} link. D-LOG's signup flow is a code typed into the app — no redirect URL,
  no universal link, nothing to configure per platform when this ships to the stores. The stock
  Supabase template only contains the link, so a stock template means the app's code box has nothing
  to type and a new account can never be confirmed. See CREATE AN ACCOUNT in js/app.js.

  Pair it with Authentication -> Sign In / Providers -> "Allow new users to sign up" = ON. While
  that is off, every signup comes back 422 and the app says new accounts aren't open yet.

  Same OTP settings as recovery.html: "Email OTP Expiration" = 600 seconds (the app's copy says ten
  minutes) and "Email OTP length" anywhere from 6 to 10 — the app accepts the whole range and no
  string in it names a number, so this template does not need to either.
-->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: #f4efe6; padding: 32px 20px; color: #2b2724;">
  <div style="max-width: 420px; margin: 0 auto; background: #fbf8f3; border: 1px solid #e3dace; border-radius: 14px; padding: 28px;">

    <div style="font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: #8a8078;">D-LOG</div>
    <h1 style="font-size: 22px; margin: 6px 0 18px; font-weight: 700;">Confirm your account</h1>

    <p style="font-size: 15px; line-height: 1.6; margin: 0 0 18px;">
      Welcome. Type this code into D-LOG to finish setting up your account:
    </p>

    <div style="font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 34px; font-weight: 700; letter-spacing: 10px; text-align: center; background: #f4efe6; border: 1px solid #e3dace; border-radius: 10px; padding: 18px 12px 18px 22px; margin: 0 0 18px;">
      {{ .Token }}
    </div>

    <p style="font-size: 14px; line-height: 1.6; color: #6c635c; margin: 0 0 10px;">
      The code expires in ten minutes and can only be used once.
    </p>
    <p style="font-size: 14px; line-height: 1.6; color: #6c635c; margin: 0;">
      If you didn't sign up for D-LOG, ignore this email. No account is created until this code is
      typed in.
    </p>

  </div>
</div>
